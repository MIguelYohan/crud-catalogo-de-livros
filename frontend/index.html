<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Livros</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Sistema de Cadastro de Livros</h1>
        </header>

        <section class="form-section" aria-labelledby="form-title">
            <h2 id="form-title">Cadastro / Edição de Livro</h2>
            <div id="feedback" class="feedback" aria-live="polite"></div>
            
            <form id="livro-form" novalidate>
                <input type="hidden" id="livro-id" name="id">
                
                <div class="form-group">
                    <label for="titulo">Título *</label>
                    <input type="text" id="titulo" name="titulo" required>
                    <span class="error-message" id="erro-titulo"></span>
                </div>
                
                <div class="form-group">
                    <label for="autor">Autor *</label>
                    <input type="text" id="autor" name="autor" required>
                    <span class="error-message" id="erro-autor"></span>
                </div>
                
                <div class="form-group">
                    <label for="categoria">Categoria *</label>
                    <select id="categoria" name="categoria_id" required>
                        <option value="">Selecione uma categoria</option>
                    </select>
                    <span class="error-message" id="erro-categoria"></span>
                </div>
                
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" name="status">
                        <option value="true">Ativo</option>
                        <option value="false">Inativo</option>
                    </select>
                </div>
                
                <div class="form-actions">
                    <button type="submit" id="btn-salvar" class="btn btn-primary">Salvar</button>
                    <button type="button" id="btn-cancelar" class="btn btn-secondary" style="display: none;">Cancelar Edição</button>
                </div>
            </form>
        </section>

        <section class="filter-section" aria-labelledby="filter-title">
            <h2 id="filter-title">Buscar Livros</h2>
            <div class="filter-controls">
                <input type="text" id="busca" placeholder="Buscar por título ou autor...">
                <button type="button" id="btn-buscar" class="btn btn-primary">Buscar</button>
                <button type="button" id="btn-listar-todos" class="btn btn-secondary">Listar Todos</button>
                <button type="button" id="btn-ativos" class="btn btn-secondary">Apenas Ativos</button>
            </div>
        </section>

        <section class="list-section" aria-labelledby="list-title">
            <h2 id="list-title">Lista de Livros</h2>
            <div class="table-wrapper">
                <table id="tabela-livros">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Título</th>
                            <th>Autor</th>
                            <th>Categoria</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-livros">
                        <tr>
                            <td colspan="6" class="loading">Carregando livros...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <p id="mensagem-vazia" class="mensagem-vazia" style="display: none;">Nenhum livro encontrado.</p>
        </section>
    </div>

    <script src="static/js/script.js"></script>
</body>
</html>
